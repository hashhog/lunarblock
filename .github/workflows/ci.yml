name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lua syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "luajit-2.1"
      # No LuaRocks/lua-cjson here: `luajit -bl` only needs the interpreter,
      # and the luarocks install step was the CI failure point (transient
      # network errors).  Dependencies are irrelevant to a syntax check.
      - name: Syntax check
        run: |
          find src/ spec/ -name '*.lua' -exec luajit -bl {} /dev/null \;

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: lunarblock:${{ github.sha }}
